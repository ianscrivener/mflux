name: Issue triage

on:
  schedule:
    # Every 30 minutes. Scheduled runs use the default branch and can start late.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log the decisions but post nothing"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: issue-triage
  cancel-in-progress: false

jobs:
  triage:
    # Forks have no ANTHROPIC_API_KEY and must not post comments.
    if: github.repository == 'mflux-community/mflux'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d  # v10.0.0
        with:
          version: "0.12.4"  # pinned uv: matches tests.yml

      # Issue text is untrusted: it only reaches the model as data and never reaches a shell.
      # A schedule run is never a dry run. A manual run is a dry run unless the input says otherwise.
      - name: Triage new issues
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRIAGE_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          uv run --no-project --python 3.13 \
            --with "anthropic>=0.40,<1" --with "jinja2>=3.1,<4" --with "requests>=2.33" \
            python scripts/issue_triage/triage.py
